name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  windows:
    name: Check and build Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)\+\d+\s*$'
          if (-not $match) { throw 'Expected version: X.Y.Z+BUILD in pubspec.yaml' }
          $version = $match.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match pubspec version v$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Dart code
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Build Windows x64
        run: flutter build windows --release --no-pub

      - name: Package and checksum the installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $bundleDir = 'build/windows/x64/runner/Release'
          $required = @(
            'fldoc.exe', 'flutter_windows.dll', 'sqlite3.dll', 'rg.exe',
            'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll',
            'data/app.so', 'data/flutter_assets/AssetManifest.bin'
          )
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path $bundleDir $file) -PathType Leaf)) {
              throw "Missing Windows build output: $file"
            }
          }

          $iscc = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          & $iscc "/DAppVersion=$env:APP_VERSION" installer/flDoc.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $installer = Get-Item "build/installer/flDoc-Setup-$env:APP_VERSION.exe"
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $installer.DirectoryName 'SHA256SUMS.txt'), "$hash  $($installer.Name)`n")

      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flDoc-windows-x64
          path: |
            build/installer/flDoc-Setup-${{ steps.version.outputs.version }}.exe
            build/installer/SHA256SUMS.txt
          if-no-files-found: error
          overwrite: true

  android:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select JDK 21
        shell: bash
        run: |
          echo "JAVA_HOME=${JAVA_HOME_21_X64:?}" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Android release APK (arm64-v8a)
        env:
          FLDOC_ANDROID_UNSIGNED: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'true' || 'false' }}
        run: flutter build apk --release --target-platform android-arm64 --no-pub

      - name: Verify Android APK architecture
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          abis=$(unzip -Z1 "$apk" 'lib/*' | cut -d/ -f2 | sort -u)
          echo "Android APK ABIs: $abis"
          if [ "$abis" != "arm64-v8a" ]; then
            echo "Expected only arm64-v8a in APK, got: $abis" >&2
            exit 1
          fi

      - name: Sign and verify the Android release APK
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          FLDOC_ANDROID_KEYSTORE_BASE64: ${{ secrets.FLDOC_ANDROID_KEYSTORE_BASE64 }}
          FLDOC_ANDROID_STORE_PASSWORD: ${{ secrets.FLDOC_ANDROID_STORE_PASSWORD }}
          FLDOC_ANDROID_KEY_ALIAS: ${{ secrets.FLDOC_ANDROID_KEY_ALIAS }}
          FLDOC_ANDROID_KEY_PASSWORD: ${{ secrets.FLDOC_ANDROID_KEY_PASSWORD }}
          FLDOC_ANDROID_CERT_SHA256: ${{ vars.FLDOC_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${FLDOC_ANDROID_KEYSTORE_BASE64:?Set the release keystore secret}"
          : "${FLDOC_ANDROID_STORE_PASSWORD:?Set the release keystore password secret}"
          : "${FLDOC_ANDROID_KEY_ALIAS:?Set the release key alias secret}"
          : "${FLDOC_ANDROID_KEY_PASSWORD:?Set the release key password secret}"
          expected=${FLDOC_ANDROID_CERT_SHA256//:/}
          expected=${expected,,}
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Set FLDOC_ANDROID_CERT_SHA256 to the release certificate SHA-256 fingerprint' >&2
            exit 1
          fi

          sdk_root=${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK not found}}
          apksigner=$(find "$sdk_root/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          if [[ ! -x "$apksigner" ]]; then
            echo 'Android SDK Build Tools apksigner not found' >&2
            exit 1
          fi
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/fldoc-android-release.XXXXXXXX")
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$FLDOC_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          apk=build/app/outputs/flutter-apk/app-release.apk
          "$apksigner" sign --ks "$keystore" --ks-key-alias "$FLDOC_ANDROID_KEY_ALIAS" \
            --ks-pass env:FLDOC_ANDROID_STORE_PASSWORD --key-pass env:FLDOC_ANDROID_KEY_PASSWORD "$apk"
          actual=$("$apksigner" verify --print-certs "$apk" \
            | awk '/certificate SHA-256 digest:/ { sub(/\r$/, "", $NF); print tolower($NF) }' | sort -u)
          if [[ "$actual" != "$expected" ]]; then
            echo 'The Android APK signer does not match FLDOC_ANDROID_CERT_SHA256' >&2
            exit 1
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flDoc-android-arm64-v8a
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          overwrite: true

  macos:
    name: Build macOS app (${{ matrix.arch }})
    runs-on: macos-26
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build macOS release app (${{ matrix.arch }})
        env:
          FLUTTER_XCODE_ARCHS: ${{ matrix.arch }}
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: 'NO'
        run: flutter build macos --release --no-pub

      - name: Verify architecture and archive the app
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          app=build/macos/Build/Products/Release/flDoc.app
          main_archs=$(lipo -archs "$app/Contents/MacOS/flDoc" | xargs)
          if [ "$main_archs" != "$TARGET_ARCH" ]; then
            echo "Expected main binary arch '$TARGET_ARCH', got '$main_archs'" >&2
            exit 1
          fi

          # Ensure every Mach-O binary inside the app bundle is single-arch.
          resigned=0
          while IFS= read -r -d '' bin; do
            kind=$(file -b "$bin")
            if [[ "$kind" == Mach-O* ]]; then
              archs=$(lipo -archs "$bin" | xargs)
              if [ "$archs" != "$TARGET_ARCH" ]; then
                if lipo "$bin" -verify_arch "$TARGET_ARCH"; then
                  echo "Thinning $bin ($archs -> $TARGET_ARCH)"
                  lipo "$bin" -thin "$TARGET_ARCH" -output "$bin.thin"
                  mv "$bin.thin" "$bin"
                  target="$bin"
                  case "$bin" in
                    *.framework/*)
                      target="${bin%%.framework/*}.framework"
                      ;;
                  esac
                  codesign --force --sign - "$target"
                  resigned=1
                else
                  echo "Binary $bin has archs '$archs', missing '$TARGET_ARCH'" >&2
                  exit 1
                fi
              fi
            fi
          done < <(find "$app" -type f -print0)

          if [ "$resigned" -eq 1 ]; then
            codesign --force --sign - --preserve-metadata=entitlements "$app"
          fi

          while IFS= read -r -d '' bin; do
            kind=$(file -b "$bin")
            if [[ "$kind" == Mach-O* ]]; then
              archs=$(lipo -archs "$bin" | xargs)
              echo "$bin: $archs"
              if [ "$archs" != "$TARGET_ARCH" ]; then
                echo "Unexpected arch '$archs' in $bin (expected '$TARGET_ARCH')" >&2
                exit 1
              fi
            fi
          done < <(find "$app" -type f -print0)

          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "build/flDoc-macos-${TARGET_ARCH}.zip"

      - name: Upload macOS app archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flDoc-macos-${{ matrix.arch }}
          path: build/flDoc-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [windows, android, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: flDoc-*
          merge-multiple: true
          path: release

      - name: Verify and publish all platform packages
        shell: bash
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          version=${GITHUB_REF_NAME#v}
          apk="flDoc-${version}-android-arm64-v8a.apk"
          mac_arm64="flDoc-${version}-macos-arm64.zip"
          mac_x86_64="flDoc-${version}-macos-x86_64.zip"
          mv app-release.apk "$apk"
          mv flDoc-macos-arm64.zip "$mac_arm64"
          mv flDoc-macos-x86_64.zip "$mac_x86_64"
          sha256sum "$apk" "$mac_arm64" "$mac_x86_64" >> SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" \
            "flDoc-Setup-$version.exe" "$apk" "$mac_arm64" "$mac_x86_64" SHA256SUMS.txt \
            --verify-tag --title "flDoc $GITHUB_REF_NAME" --generate-notes
